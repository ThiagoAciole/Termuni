name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        profile: [development, default]
    steps:
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential meson ninja-build pkg-config python3 python3-gi \
            libgtk-4-dev libadwaita-1-dev libglib2.0-dev libpango1.0-dev \
            libx11-dev libxtst-dev gettext desktop-file-utils appstream \
            at-spi2-core dbus-daemon dbus-x11 xvfb xauth mesa-dri-drivers \
            fonts-dejavu-core fonts-noto-color-emoji vim less btop tar xz-utils
      - uses: actions/checkout@v4
      - name: Install the manifest-pinned Zig toolchain
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request
          source = json.loads(pathlib.Path('tools/zig-toolchain.json').read_text())
          archive = urllib.request.urlopen(source['url']).read()
          assert hashlib.sha256(archive).hexdigest() == source['sha256']
          pathlib.Path('/tmp/zig.tar.xz').write_bytes(archive)
          PY
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xf /tmp/zig.tar.xz -C "$RUNNER_TEMP/zig"
          echo "$RUNNER_TEMP/zig/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
      - name: Build, test and stage installation
        run: bash tools/ci-check.sh '${{ matrix.profile }}'
      - name: Test the AT-SPI bridge on a private bus
        run: /usr/bin/python3 tests/check-accessible-atspi.py --binary build-ci-${{ matrix.profile }}/tests/test-ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.profile }}-logs
          path: |
            build-ci-*/meson-logs/
            build-ci-*/ci-install/usr/share/
